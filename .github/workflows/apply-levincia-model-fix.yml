name: Apply Levincia model loader fix

on:
  push:
    branches:
      - agent/fix-levincia-cache

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch OnDemandFetcher
        shell: bash
        run: |
          set -euo pipefail
          TARGET='Levincia-Client-Master/Levincia-Client/src/main/java/org/necrotic/client/cache/ondemand/OnDemandFetcher.java'
          git fetch origin main
          git show origin/main:"$TARGET" > "$TARGET"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Levincia-Client-Master/Levincia-Client/src/main/java/org/necrotic/client/cache/ondemand/OnDemandFetcher.java')
          s = p.read_text()
          anchor = 'import org.necrotic.client.io.ByteBuffer;'
          model_import = 'import org.necrotic.client.world.Model;'
          if model_import not in s:
              s = s.replace(anchor, anchor + '\n' + model_import, 1)
          old = '''\t@Override\n\tpublic void get(int i) {\n\t\trequestFileData(0, i);\n\t}'''
          new = '''\t@Override\n\tpublic void get(int i) {\n\t\ttry {\n\t\t\tif (clientInstance != null\n\t\t\t\t\t&& clientInstance.decompressors != null\n\t\t\t\t\t&& clientInstance.decompressors.length > 1\n\t\t\t\t\t&& clientInstance.decompressors[1] != null) {\n\t\t\t\tbyte[] packedModel = clientInstance.decompressors[1].decompress(i);\n\t\t\t\tif (packedModel != null) {\n\t\t\t\t\tModel.load(packedModel, i);\n\t\t\t\t\treturn;\n\t\t\t\t}\n\t\t\t}\n\t\t} catch (Exception e) {\n\t\t\tSystem.out.println("[LEVINCIA MODEL CACHE] Failed direct model load: " + i);\n\t\t}\n\t\trequestFileData(0, i);\n\t}'''
          if old not in s:
              raise SystemExit('Expected get(int) method not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Remove temporary repair files
        run: |
          rm -f agent/fix-levincia-cache-placeholder.txt
          rm -f Levincia-Client-Master/Levincia-Client/TEST_WRITE_REMOVE.txt
          rm -f .github/workflows/apply-levincia-model-fix.yml

      - name: Commit repaired loader
        run: |
          git config user.name 'Levincia Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix packed model loading'
          git push origin HEAD:agent/fix-levincia-cache
