name: One-time Levincia local map completion fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch local map completion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Levincia-Client-Master/Levincia-Client/src/main/java/org/necrotic/client/cache/ondemand/OnDemandFetcher.java')
          s = p.read_text()

          old = '''\t\t\tsynchronized (loadRequestList) {\n\t\t\t\tloadRequestList.pushHead(onDemandData_1);\n\t\t\t}\n\n\t\t\tqueue.insertHead(onDemandData_1);'''

          new = '''\t\t\tqueue.insertHead(onDemandData_1);\n\n\t\t\t// Levincia stores maps locally in main_file_cache.idx4 (decompressor slot 5).\n\t\t\t// Complete local map requests immediately so terrainData/objectData are filled\n\t\t\t// without waiting on the legacy update-server queue.\n\t\t\tif (dataType == 3\n\t\t\t\t\t&& clientInstance != null\n\t\t\t\t\t&& clientInstance.decompressors != null\n\t\t\t\t\t&& clientInstance.decompressors.length > 5\n\t\t\t\t\t&& clientInstance.decompressors[5] != null) {\n\t\t\t\tbyte[] localMap = clientInstance.decompressors[5].decompress(fileID);\n\t\t\t\tif (localMap != null) {\n\t\t\t\t\tonDemandData_1.setBuffer(localMap);\n\t\t\t\t\tsynchronized (incompleteList) {\n\t\t\t\t\t\tincompleteList.pushHead(onDemandData_1);\n\t\t\t\t\t}\n\t\t\t\t\treturn;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tsynchronized (loadRequestList) {\n\t\t\t\tloadRequestList.pushHead(onDemandData_1);\n\t\t\t}'''

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif 'Complete local map requests immediately' in s:
              print('Local map completion fix already present.')
          else:
              raise SystemExit('Expected requestFileData queue block not found; refusing unsafe patch')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/one-time-map-local-completion.yml
          git config user.name 'Levincia Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Complete local map requests from idx4'
          git push origin HEAD:main
